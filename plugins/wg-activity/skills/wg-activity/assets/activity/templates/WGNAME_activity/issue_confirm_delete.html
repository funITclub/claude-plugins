{% extends 'WGNAME_activity/base.html' %}
{% block title %}#{{ issue.pk }} の削除 | {{ wg.name }}{% endblock %}
{% block content %}
<h1>チケット #{{ issue.pk }} を削除します</h1>
<div class="box">
    <p>{{ issue.subject }}</p>
    <p class="helptext">この操作は取り消せません。</p>
</div>
<form method="post">
    {% csrf_token %}
    <div class="toolbar">
        <button class="btn danger" type="submit">削除する</button>
        <a class="btn" href="{{ issue.get_absolute_url }}">やめる</a>
    </div>
</form>
{% endblock %}
